    <meta name="description" content="Institutional MetaTrader 5 trading statistics visualization, equity drawdown analytics, and real-time position synchronization via WebSocket." />
    <meta property="og:title" content="MetaPulse MT5 — Real-Time Trading Statistics & WebSocket Sync" />
    <meta property="og:description" content="Institutional MetaTrader 5 trading statistics visualization, equity drawdown analytics, and real-time position synchronization via WebSocket." />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var patchTarget = function (target) {
            if (!target) return;
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (!desc || desc.configurable !== false) {
              Object.defineProperty(target, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return currentFetch;
                },
                set: function (val) {
                  if (typeof val === 'function') {
                    currentFetch = val;
                  }
                }
              });
            }
          };
          patchTarget(Window.prototype);
          patchTarget(window);
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (event) {
            var msg = String(event && event.message ? event.message : '');
            var file = String(event && event.filename ? event.filename : '');
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              file.indexOf('chrome-extension://') === 0
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );
      })();
    </script>
